<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>取消訂單｜校園小吃線上點餐系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --brand: #0f5735; --page: #f5f8f6; }
    body { font-family: "Microsoft JhengHei", system-ui, sans-serif; background: var(--page); color: #26352c; }
    .navbar { background: var(--brand); }
    .navbar-brand { color: white; font-weight: 700; }
    .navbar .btn-outline-light { color: rgb(249, 151, 22); font-weight: 700; }
    .page-wrap { max-width: 760px; }
    .page-title { color: var(--brand); font-weight: 800; }
    .main-card { border: 1px solid #dce8df; border-radius: 18px; box-shadow: 0 5px 18px #79eea210; }
    .warning-panel { background: #fff7e6; border: 1px solid #f1d89d; border-radius: 12px; color: #74520c; }
    .order-info { background: #f7faf8; border-radius: 12px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container page-wrap">
      <a class="navbar-brand" href="menu.html">校園小吃線上點餐系統</a>
      <a class="btn btn-sm btn-outline-light" href="student-orders.html">返回我的訂單</a>
    </div>
  </nav>

  <main class="container page-wrap py-5">
    <p class="text-secondary mb-1">學生專區</p>
    <h1 class="page-title h2 mb-2">取消訂單</h1>
    <p class="text-secondary mb-4">請確認訂單資料，確定要取消時再送出申請。</p>

    <section class="main-card card p-3 p-md-4">
      <div class="mb-3">
        <label for="orderId" class="form-label fw-semibold">訂單編號</label>
        <div class="input-group">
          <input id="orderId" class="form-control" placeholder="請輸入要取消的訂單編號（例如：1）">
          <button type="button" class="btn btn-outline-success" id="loadOrderBtn">查詢訂單</button>
        </div>
      </div>

      <div id="orderInfo" class="order-info p-3 mb-3">
        <div class="text-secondary small">訂單資料</div>
        <div class="text-secondary mt-2">輸入或從「我的訂單」點選取消後，這裡會顯示訂單資訊。</div>
      </div>

      <div class="warning-panel p-3 mb-4">
        <div class="fw-bold mb-1">取消前請留意</div>
        <ul class="mb-0 ps-3">
          <li>請確認訂單編號與餐點內容正確。</li>
          <li>確認取消後，系統將呼叫後端 <code>DELETE /orders/{order_id}</code> 移除該筆訂單。</li>
        </ul>
      </div>

      <div class="d-flex flex-column flex-sm-row justify-content-end gap-2">
        <a href="student-orders.html" class="btn btn-outline-secondary">返回訂單列表</a>
        <button type="button" class="btn btn-danger" id="cancelBtn">確認取消訂單</button>
      </div>
      <div id="message" class="mt-3" aria-live="polite"></div>
    </section>
  </main>

  <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="confirmTitle">再次確認</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>
        <div class="modal-body">確定要取消這筆訂單嗎？此操作會直接刪除後端資料庫中的訂單紀錄。</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">先不要</button>
          <button type="button" class="btn btn-danger" id="confirmCancelBtn">確定取消</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const orderIdInput = document.getElementById("orderId");
    const orderInfo = document.getElementById("orderInfo");
    const message = document.getElementById("message");
    const confirmModal = new bootstrap.Modal(document.getElementById("confirmModal"));

    let currentOrder = null;

    async function loadOrder() {
      const rawId = orderIdInput.value.trim();
      if (!rawId) {
        orderInfo.innerHTML = '<div class="text-secondary">請輸入訂單編號。</div>';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/orders/${encodeURIComponent(rawId)}`);
        const result = await response.json();

        if (!response.ok) {
          currentOrder = null;
          orderInfo.innerHTML = `<div class="text-danger">${result.detail || "找不到這筆訂單，請確認訂單編號。"}</div>`;
          return;
        }

        currentOrder = result.data;
        const itemsHtml = (currentOrder.items || []).map(item => `
          <div class="d-flex justify-content-between py-1">
            <span>${item.name} × ${item.quantity}</span>
            <span>$${Number(item.price) * Number(item.quantity)}</span>
          </div>
        `).join("");

        orderInfo.innerHTML = `
          <div>
            <div class="text-secondary small">訂單編號</div>
            <strong>#${currentOrder.id}</strong>
          </div>
          <div class="mt-2">
            <div class="text-secondary small">學生資訊</div>
            <strong>${currentOrder.student_name || "未提供"}（${currentOrder.student_id || "未提供"}）</strong>
          </div>
          <div class="mt-2">
            <div class="text-secondary small">目前狀態</div>
            <strong>${currentOrder.status || "待接單"}</strong>
          </div>
          <hr>
          <h6>餐點內容</h6>
          ${itemsHtml || '<div class="text-secondary small">無明細資料</div>'}
          <hr>
          <div class="d-flex justify-content-between fw-bold">
            <span>訂單總額</span>
            <span>$${Number(currentOrder.total_price || 0).toLocaleString("zh-TW")}</span>
          </div>
        `;
      } catch (error) {
        currentOrder = null;
        orderInfo.innerHTML = `<div class="text-danger">查詢訂單時發生錯誤：${error.message}</div>`;
      }
    }

    document.getElementById("loadOrderBtn").addEventListener("click", loadOrder);

    const params = new URLSearchParams(location.search);
    if (params.get("orderId")) {
      orderIdInput.value = params.get("orderId");
      loadOrder();
    }

    document.getElementById("cancelBtn").addEventListener("click", async () => {
      message.innerHTML = "";
      await loadOrder();
      if (!currentOrder) {
        message.innerHTML = '<div class="alert alert-warning">請先輸入有效的訂單編號。</div>';
        return;
      }
      confirmModal.show();
    });

    document.getElementById("confirmCancelBtn").addEventListener("click", async () => {
      const targetId = orderIdInput.value.trim();
      confirmModal.hide();

      try {
        const response = await fetch(`${API_BASE}/orders/${encodeURIComponent(targetId)}`, {
          method: "DELETE"
        });
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.detail || "取消訂單失敗");
        }

        currentOrder = null;
        orderInfo.innerHTML = '<div class="text-secondary">此筆訂單已取消並從系統移除。</div>';
        message.innerHTML = `<div class="alert alert-success">${result.message || "訂單已成功取消。"}</div>`;
      } catch (error) {
        message.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
      }
    });
  </script>
</body>
</html>
