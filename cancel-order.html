<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>取消訂單｜校園小吃線上點餐系統</title>
  <link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
  <style>
    :root { --brand: #0f5735; --page: #f5f8f6; }
    body { font-family: "Microsoft JhengHei", system-ui, sans-serif; background: var(--page); color: #26352c; }
    .navbar { background: var(--brand); }
    .navbar-brand { color: white; font-weight: 700; }
    .navbar .btn-outline-light { color: rgb(249, 151, 22); font-weight: 700; }
    .page-wrap { max-width: 760px; }
    .page-title { color: var(--brand); font-weight: 800; }
    .main-card { border: 1px solid #dce8df; border-radius: 18px; box-shadow: 0 5px 18px #79eea210; }
    .warning-panel { background: #fff7e6; border: 1px solid #f1d89d; border-radius: 12px; color: #74520c; }
    .order-info { background: #f7faf8; border-radius: 12px; }
    .btn-brand { background: var(--brand); color: white; }
    .btn-brand:hover { background: #0f5735; color: white; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container page-wrap">
      <a class="navbar-brand" href="menu.html">校園小吃線上點餐系統</a>
      <a class="btn btn-sm btn-outline-light" href="student-orders.html">返回我的訂單</a>
    </div>
  </nav>

  <main class="container page-wrap py-5">
    <p class="text-secondary mb-1">學生專區</p>
    <h1 class="page-title h2 mb-2">取消訂單</h1>
    <p class="text-secondary mb-4">請確認訂單資料，確定要取消時再送出申請。</p>

    <section class="main-card card p-3 p-md-4">
      <div class="mb-3">
        <label for="orderId" class="form-label fw-semibold">訂單編號</label>
        <input id="orderId" class="form-control" placeholder="請輸入要取消的訂單編號">
      </div>

      <div id="orderInfo" class="order-info p-3 mb-3">
        <div class="text-secondary small">訂單資料</div>
        <div class="text-secondary mt-2">輸入或從「我的訂單」點選取消後，這裡會顯示訂單資訊。</div>
      </div>

      <div class="warning-panel p-3 mb-4">
        <div class="fw-bold mb-1">取消前請留意</div>
        <ul class="mb-0 ps-3">
          <li>請確認訂單編號與餐點內容正確。</li>
          <li>訂單是否能取消，應以店家目前的接單／製作狀態及系統規則為準。</li>
          <li>正式系統應由後端判斷是否允許取消，不能只靠前端按鈕控制。</li>
        </ul>
      </div>

      <div class="d-flex flex-column flex-sm-row justify-content-end gap-2">
        <a href="student-orders.html" class="btn btn-outline-secondary">返回訂單列表</a>
        <button type="button" class="btn btn-danger" id="cancelBtn">確認取消訂單</button>
      </div>
      <div id="message" class="mt-3" aria-live="polite"></div>
    </section>
    <p class="small text-secondary mt-3">目前取消動作為前端示範，不會真的刪除或修改資料庫。正式串接時需配合組員的 DELETE API 規格。</p>
  </main>

  <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="confirmTitle">再次確認</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>
        <div class="modal-body">確定要取消這筆訂單嗎？此操作在正式系統中可能無法復原。</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">先不要</button>
          <button type="button" class="btn btn-danger" id="confirmCancelBtn">確定取消</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>   
const orderIdInput = document.getElementById("orderId");
const orderInfo = document.getElementById("orderInfo");
const message = document.getElementById("message");

const confirmModal = new bootstrap.Modal(
  document.getElementById("confirmModal")
);

let currentOrder = null;

// 讀取所有訂單
function getOrders() {
  return JSON.parse(localStorage.getItem("orders") || "[]");
}

// 儲存所有訂單
function saveOrders(orders) {
  localStorage.setItem("orders", JSON.stringify(orders));
}

// 判斷訂單目前狀態
function getOrderStatus(order) {
  if (order.status === "已取消") {
    return "已取消";
  }

  const createdTime = new Date(order.createdAt).getTime();
  const elapsed = Date.now() - createdTime;

  if (elapsed < 3 * 60 * 1000) {
    return "待接單";
  }

  if (elapsed < 5 * 60 * 1000) {
    return "製作中";
  }

  return "可取餐";
}

// 判斷是否允許取消
function canCancel(order) {
  const status = getOrderStatus(order);

  return status === "待接單";
}

// 顯示訂單資料
function loadOrder() {
  const id = orderIdInput.value.trim();
  const orders = getOrders();

  currentOrder = orders.find(
    order => order.orderNumber === id
  );

  if (!currentOrder) {
    orderInfo.innerHTML =
      '<div class="text-secondary">找不到這筆訂單，請確認訂單編號。</div>';
    message.innerHTML = "";
    return;
  }

  const status = getOrderStatus(currentOrder);

  orderInfo.innerHTML = `
    <div>
      <div class="text-secondary small">訂單編號</div>
      <strong>${currentOrder.orderNumber}</strong>
    </div>

    <div class="mt-2">
      <div class="text-secondary small">目前狀態</div>
      <strong>${status}</strong>
    </div>

    <hr>

    <h6>餐點內容</h6>

    ${(currentOrder.items || []).map(item => `
      <div class="d-flex justify-content-between py-1">
        <span>${item.name} × ${item.quantity}</span>
        <span>$${item.price * item.quantity}</span>
      </div>
    `).join("")}

    <hr>

    <div class="d-flex justify-content-between fw-bold">
      <span>訂單總額</span>
      <span>$${currentOrder.total}</span>
    </div>
  `;

  message.innerHTML = "";
}

// 輸入訂單編號時自動查詢
orderIdInput.addEventListener("input", loadOrder);

// 從 student-orders 接收訂單編號
const params = new URLSearchParams(location.search);

if (params.get("orderId")) {
  orderIdInput.value = params.get("orderId");
}

loadOrder();

// 第一次點擊：檢查是否允許取消
document.getElementById("cancelBtn").addEventListener("click", () => {
  loadOrder();

  if (!currentOrder) {
    message.innerHTML =
      '<div class="alert alert-warning">請先輸入有效的訂單編號。</div>';
    return;
  }

  if (!canCancel(currentOrder)) {
    const status = getOrderStatus(currentOrder);

    message.innerHTML =
      `<div class="alert alert-warning">
        ${status === "製作中"
          ? "已在製作中，無法取消。"
          : status === "可取餐"
          ? "餐點已可取餐，無法取消。"
          : "這筆訂單已取消，無法再次取消。"}
      </div>`;
    return;
  }

  confirmModal.show();
});

// 第二次點擊：再次確認狀態，避免等待期間超過取消期限
document.getElementById("confirmCancelBtn").addEventListener("click", () => {
  const orders = getOrders();

  const index = orders.findIndex(
    order => order.orderNumber === orderIdInput.value.trim()
  );

  confirmModal.hide();

  if (index === -1) {
    currentOrder = null;
    message.innerHTML =
      '<div class="alert alert-warning">找不到這筆訂單。</div>';
    return;
  }

  const order = orders[index];

  // 再次檢查，不能只靠第一次確認
  if (!canCancel(order)) {
    currentOrder = order;
    loadOrder();

    message.innerHTML =
      '<div class="alert alert-warning">已在製作中或已進入後續狀態，無法取消。</div>';
    return;
  }

  // 更新原本的訂單，不是刪除訂單
  orders[index].status = "已取消";

  saveOrders(orders);

  currentOrder = orders[index];

  loadOrder();

  message.innerHTML =
    '<div class="alert alert-success">訂單已成功取消。</div>';
});
  </script>
</body>
</html>
