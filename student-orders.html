<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的訂單｜校園小吃線上點餐系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --brand: #146c43; --brand-soft: #eaf4ee; --page: #f5f8f6; }
    body { font-family: "Microsoft JhengHei", system-ui, sans-serif; background: var(--page); color: #26352c; }
    .navbar { background: var(--brand); }
    .navbar-brand { color: white; font-weight: 700; }
    .navbar .btn-outline-light { color: rgb(249, 151, 22); font-weight: 700; }
    .page-wrap { max-width: 1000px; }
    .page-title { color: var(--brand); font-weight: 800; }
    .order-card { border: 1px solid #dce8df; border-radius: 16px; background: white; padding: 1.25rem; box-shadow: 0 5px 18px #183b2410; }
    .status { display: inline-block; padding: .35rem .75rem; border-radius: 999px; font-size: .85rem; font-weight: 700; }
    .status-making { background: #fef3c7; color: #d97706; }
    .status-ready { background: #dcfce7; color: #15803d; }
    .status-done { background: #e9ecef; color: #58616a; }
    .empty-state { border: 2px dashed #cbd9ce; border-radius: 16px; background: white; }
    .btn-brand { background: var(--brand); color: white; }
    .btn-brand:hover { background: #0f5735; color: white; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container page-wrap">
      <a class="navbar-brand" href="menu.html">校園小吃線上點餐系統</a>
      <a class="btn btn-sm btn-outline-light" href="checkout.html">前往結帳</a>
    </div>
  </nav>

  <main class="container page-wrap py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <p class="text-secondary mb-1">學生專區</p>
        <h1 class="page-title h2 mb-1">我的訂單</h1>
        <p class="text-secondary mb-0">查詢訂單內容、目前製作進度與預計取餐時間。</p>
      </div>
      <button class="btn btn-brand" id="refreshBtn" type="button">重新整理</button>
    </div>

    <section class="card border-0 rounded-4 p-3 p-md-4 mb-4">
      <form id="searchForm" class="row g-3 align-items-end">
        <div class="col-md-8">
          <label for="studentId" class="form-label fw-semibold">學生學號</label>
          <input class="form-control" id="studentId" name="studentId" placeholder="例如：113022047" required>
          <div class="form-text">請輸入下單時使用的學號，才能查詢自己的訂單。</div>
        </div>
        <div class="col-md-4 d-grid">
          <button class="btn btn-brand" type="submit">查詢訂單</button>
        </div>
      </form>
    </section>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h5 fw-bold mb-0">查詢結果</h2>
      <span class="text-secondary small" id="resultCount">尚未查詢</span>
    </div>
    <div id="ordersList" class="d-grid gap-3">
      <div class="empty-state text-center p-5 text-secondary">
        請先輸入學號，再按下「查詢訂單」。
      </div>
    </div>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const list = document.getElementById("ordersList");
    const count = document.getElementById("resultCount");
    const form = document.getElementById("searchForm");
    const studentInput = document.getElementById("studentId");
    const refreshBtn = document.getElementById("refreshBtn");

    function statusClass(status) {
      if (status === "待接單" || status === "製作中") return "status-making";
      if (status === "可取餐") return "status-ready";
      return "status-done";
    }

    async function fetchAndRenderOrders(studentId) {
      const cleanedId = studentId.trim();
      if (!cleanedId) return;

      count.textContent = "查詢中...";
      try {
        const response = await fetch(`${API_BASE}/orders?student_id=${encodeURIComponent(cleanedId)}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "查詢訂單失敗");
        }

        const myOrders = data.orders || [];
        count.textContent = `查詢結果：${myOrders.length} 筆`;
        list.innerHTML = "";

        if (myOrders.length === 0) {
          list.innerHTML = '<div class="empty-state text-center p-5 text-secondary">查無訂單資料</div>';
          return;
        }

        myOrders.forEach(order => {
          const orderElement = document.createElement("div");
          orderElement.className = "order-card";
          const statusText = order.status || "待接單";
          const itemsHtml = (order.items || []).map(item => `
            <li>${item.name} × ${item.quantity}（$${Number(item.price) * Number(item.quantity)}）</li>
          `).join("");

          orderElement.innerHTML = `
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
              <h3 class="h5 fw-bold mb-0">訂單編號：#${order.id}</h3>
              <span class="status ${statusClass(statusText)}">${statusText}</span>
            </div>
            <p class="mb-1">學生姓名：${order.student_name || "未提供"}｜學號：${order.student_id || cleanedId}</p>
            <p class="mb-1">預計取餐：${order.pickup_time || "儘快取餐"}｜下單時間：${order.created_at || "未提供"}</p>
            ${order.note ? `<p class="mb-2 text-secondary">備註：${order.note}</p>` : ""}
            <h4 class="h6 fw-bold mt-3">餐點內容</h4>
            <ul class="mb-2">
              ${itemsHtml || "<li>無明細資料</li>"}
            </ul>
            <div class="d-flex justify-content-between align-items-center border-top pt-3 mt-2">
              <strong>總金額：$${Number(order.total_price || 0).toLocaleString("zh-TW")}</strong>
              <button type="button" class="btn btn-sm btn-outline-danger" onclick="cancelOrder(${order.id}, '${cleanedId}')">取消此訂單</button>
            </div>
          `;
          list.appendChild(orderElement);
        });
      } catch (error) {
        count.textContent = "查詢失敗";
        list.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const studentId = studentInput.value.trim();
      if (!studentId) return;
      sessionStorage.setItem("studentId", studentId);
      fetchAndRenderOrders(studentId);
    });

    refreshBtn.addEventListener("click", () => {
      const studentId = studentInput.value.trim();
      if (studentId) fetchAndRenderOrders(studentId);
    });
   } catch (error) {
        count.textContent = "查詢失敗";
        list.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
      }
    }
    // 👉 在這裡貼上整段 async function cancelOrder(orderId, studentId) { ... }

    form.addEventListener("submit", event => {
    const savedStudentId = sessionStorage.getItem("studentId");
    if (savedStudentId) {
      studentInput.value = savedStudentId;
      fetchAndRenderOrders(savedStudentId);
    }
  </script>
</body>
</html>
