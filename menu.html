<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A 店家｜線上菜單</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="shop-header">
    <div class="shop-cover" aria-hidden="true">🍱</div>
    <div>
      <p class="eyebrow">線上點餐</p>
      <h1>A 店家</h1>
      <p class="shop-description">提供簡單美味的校園餐點，歡迎選購。</p>
      <p class="shop-hours">營業時間：週一至週五 09:00–21:00</p>
      <div style="margin-top: 8px;">
        <a href="student-orders.html" style="font-weight: 700; text-decoration: underline;">查詢我的訂單</a>
      </div>
    </div>
  </header>

  <main class="page-content">
    <section class="notice">
      <strong>店家公告</strong>
      <p>歡迎選購餐點，送出後可至「我的訂單」查詢進度或取消訂單。</p>
    </section>

    <nav class="category-nav" aria-label="菜單分類">
      <a class="active" href="#all">全部餐點</a>
      <a href="#main-meals">主食</a>
      <a href="#drinks">飲料</a>
    </nav>

    <section id="all" class="menu-section">
      <div class="section-heading">
        <h2>全部餐點</h2>
        <span id="menuCount">載入中...</span>
      </div>
      <div class="menu-list" id="menuList">
        <p>正在載入菜單資料...</p>
      </div>
    </section>

    <aside class="cart-section">
      <h2>我的購物車</h2>
      <div id="cartItems">
        <p>目前購物車是空的</p>
      </div>
      <hr>
      <div class="cart-total">
        <strong>總金額：</strong>
        <strong>$<span id="cartTotal">0</span></strong>
      </div>
      <button type="button" class="checkout-button" onclick="goToCheckout()">
        前往結帳
      </button>
    </aside>

    <script>
      const API_BASE = "";
      let cart = JSON.parse(sessionStorage.getItem("cart") || "[]");

      const fallbackMenus = [
        {
          id: 1,
          name: "香煎雞腿便當",
          price: 100,
          description: "香煎雞腿搭配每日新鮮配菜。",
          tag: "人氣餐點",
          icon: "🍱",
          imageClass: "food-one",
          anchorId: "main-meals"
        },
        {
          id: 2,
          name: "香噴噴滷肉飯",
          price: 60,
          description: "鹹香滷肉淋在熱騰騰的白飯上。",
          tag: "經典主食",
          icon: "🍚",
          imageClass: "food-two"
        },
        {
          id: 3,
          name: "酥脆炸雞腿",
          price: 75,
          description: "外酥內嫩，適合當作點心或加菜。",
          tag: "人氣點心",
          icon: "🍗",
          imageClass: "food-three"
        },
        {
          id: 4,
          name: "珍珠奶茶",
          price: 50,
          description: "香濃奶茶搭配 Q 彈珍珠。",
          tag: "飲料",
          icon: "🧋",
          imageClass: "food-four",
          anchorId: "drinks"
        }
      ];

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function getItemMeta(item, index) {
        const imageClasses = ["food-one", "food-two", "food-three", "food-four"];
        const defaultIcons = ["🍱", "🍚", "🍗", "🧋"];
        const name = item.name || "未命名餐點";
        const isDrink = name.includes("茶") || name.includes("飲") || name.includes("奶");

        return {
          id: item.id,
          name: name,
          price: Number(item.price) || 0,
          description: item.description || (isDrink ? "清涼解渴，搭配餐點更滿足。" : "現點現做，新鮮供應。"),
          tag: item.tag || (isDrink ? "飲料" : "供應中"),
          icon: item.icon || defaultIcons[index % defaultIcons.length],
          imageClass: item.imageClass || imageClasses[index % imageClasses.length],
          anchorId: item.anchorId || (index === 0 ? "main-meals" : (isDrink ? "drinks" : ""))
        };
      }

      function renderMenus(items) {
        const menuList = document.getElementById("menuList");
        const menuCount = document.getElementById("menuCount");

        const availableItems = (items || []).filter(item =>
          item.is_available === undefined || item.is_available === null || Number(item.is_available) === 1
        );

        menuCount.textContent = `共 ${availableItems.length} 項`;

        if (availableItems.length === 0) {
          menuList.innerHTML = "<p>目前沒有開放中的餐點。</p>";
          return;
        }

        menuList.innerHTML = availableItems.map((rawItem, index) => {
          const item = getItemMeta(rawItem, index);
          const safeName = escapeHtml(item.name);
          const safeDesc = escapeHtml(item.description);
          const safeTag = escapeHtml(item.tag);
          const safeIcon = escapeHtml(item.icon);
          const idAttr = item.anchorId ? ` id="${escapeHtml(item.anchorId)}"` : "";

          return `
            <article class="menu-item"${idAttr}>
              <div class="food-image ${escapeHtml(item.imageClass)}" role="img" aria-label="${safeName}示意圖">${safeIcon}</div>
              <div class="food-details">
                <div class="food-title-row">
                  <h3>${safeName}</h3>
                  <span class="food-price">$${item.price}</span>
                </div>
                <p>${safeDesc}</p>
                <div class="food-bottom">
                  <span class="food-tag">${safeTag}</span>
                  <button
                    type="button"
                    class="add-button"
                    aria-label="${safeName}，加入購物車"
                    onclick="addToCart(${Number(item.id)}, '${encodeURIComponent(item.name)}', ${item.price})"
                  >＋</button>
                </div>
              </div>
            </article>
          `;
        }).join("");
      }

      async function loadMenus() {
        try {
          const response = await fetch(`${API_BASE}/menus`);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const data = await response.json();
          const list = Array.isArray(data) ? data : (data.items || data.menus || data.data || []);

          if (list.length > 0) {
            renderMenus(list);
          } else {
            renderMenus(fallbackMenus);
          }
        } catch (err) {
          console.warn("讀取 /menus 失敗，改用預設餐點：", err);
          renderMenus(fallbackMenus);
        }
      }

      function saveCart() {
        sessionStorage.setItem("cart", JSON.stringify(cart));
      }

      function addToCart(id, encodedName, price) {
        const name = decodeURIComponent(encodedName);
        const item = cart.find(product => product.id === id);
        if (item) {
          item.quantity++;
        } else {
          cart.push({
            id: id,
            name: name,
            price: price,
            quantity: 1
          });
        }
        saveCart();
        updateCart();
      }

      function updateCart() {
        const cartItems = document.getElementById("cartItems");
        const cartTotal = document.getElementById("cartTotal");
        cartItems.innerHTML = "";

        if (cart.length === 0) {
          cartItems.innerHTML = "<p>目前購物車是空的</p>";
        }

        let total = 0;
        cart.forEach(item => {
          const subtotal = item.price * item.quantity;
          total += subtotal;

          cartItems.innerHTML += `
            <div class="cart-item">
              <strong>${escapeHtml(item.name)}</strong>
              <p>$${item.price} × ${item.quantity}</p>
              <div class="cart-quantity">
                <button type="button" onclick="changeQuantity(${item.id}, -1)">－</button>
                <span>${item.quantity}</span>
                <button type="button" onclick="changeQuantity(${item.id}, 1)">＋</button>
              </div>
              <p>小計：$${subtotal}</p>
            </div>
          `;
        });

        cartTotal.textContent = total;
      }

      function changeQuantity(id, amount) {
        const item = cart.find(product => product.id === id);
        if (!item) return;

        item.quantity += amount;
        if (item.quantity <= 0) {
          cart = cart.filter(product => product.id !== id);
        }
        saveCart();
        updateCart();
      }

      function goToCheckout() {
        if (cart.length === 0) {
          alert("購物車是空的，請先選擇餐點！");
          return;
        }
        saveCart();
        window.location.href = "checkout.html";
      }

      loadMenus();
      updateCart();
    </script>
  </main>
  <footer class="site-footer">校園小吃線上點餐系統｜前後端串接版</footer>
</body>
</html>
